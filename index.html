<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - المنيو</title>
    <style>
        /* إعدادات الصفحة الأساسية */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* خلفية داكنة لراحة العين */
            display: flex;
            justify-content: center;
        }

        /* حاوية الصور */
        .menu-container {
            width: 100%;
            max-width: 600px; /* عرض مناسب للكمبيوتر والموبايل */
            display: flex;
            flex-direction: column;
            gap: 0; /* لا توجد مسافات بين الصور لتبدو كصفحة واحدة */
        }

        /* تنسيق الصور */
        .menu-page {
            width: 100%;
            height: auto;
            display: block;
            /* إضافة انيميشن بسيط عند ظهور الصور */
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* لمسة جمالية للكمبيوتر */
        @media (min-width: 768px) {
            body {
                padding: 20px 0;
            }
            .menu-page {
                border-radius: 8px;
                margin-bottom: 15px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            }
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <!-- الصور بناءً على الأسماء في GitHub الخاص بك -->
        <img src="1.jpg" alt="الصفحة 1" class="menu-page">
        <img src="2.jpg" alt="الصفحة 2" class="menu-page">
        <img src="3.jpg" alt="الصفحة 3" class="menu-page">
        <img src="4.jpg" alt="الصفحة 4" class="menu-page">
        <img src="5.jpg" alt="الصفحة 5" class="menu-page">
    </div>

</body>
</html>
