<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - القائمة</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f4ece2; /* لون بيج هادئ للخلفية */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px; /* الحجم المثالي للموبايل والكمبيوتر */
            background-color: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        .menu-img {
            width: 100%;
            display: block;
            margin-bottom: 2px; /* فواصل بسيطة جداً بين الصور */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الصور الخمسة اللي رفعتها بأسماء مرتبة -->
        <img src="1.jpg" class="menu-img">
        <img src="2.jpg" class="menu-img">
        <img src="3.jpg" class="menu-img">
        <img src="4.jpg" class="menu-img">
        <img src="5.jpg" class="menu-img">
    </div>

</body>
</html>
