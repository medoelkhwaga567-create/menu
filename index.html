<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - المنيو</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #333; /* لون خلفية اختياري */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .fallback-link {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- استبدل الرابط أدناه برابط ملف المنيو الحقيقي المرفوع على موقعك -->
    <iframe src="https://docs.google.com/viewer?url=https://yourdomain.com/menu.pdf&embedded=true"></iframe>

    <!-- زر احتياطي يظهر فقط إذا أراد المستخدم تحميل الملف مباشرة -->
    <a href="https://yourdomain.com/menu.pdf" class="fallback-link" target="_blank">
        إذا لم يظهر المنيو، اضغط هنا للمشاهدة
    </a>

</body>
</html>
