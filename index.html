<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - المنيو</title>
    <style>
        body { margin: 0; padding: 0; background-color: #444; }
        #pdf-container { width: 100%; display: flex; flex-direction: column; align-items: center; }
        canvas { width: 100% !important; height: auto !important; margin-bottom: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .loading { color: white; text-align: center; margin-top: 50px; font-family: Arial; }
    </style>
</head>
<body>

    <div id="loading" class="loading">جاري تحميل المنيو...</div>
    <div id="pdf-container"></div>

    <!-- تحميل مكتبة PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <script>
        // اسم ملف المنيو الخاص بك هنا
        const url = 'menu.pdf'; 

        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const container = document.getElementById('pdf-container');
        const loadingTask = pdfjsLib.getDocument(url);

        loadingTask.promise.then(pdf => {
            document.getElementById('loading').style.display = 'none';
            
            // عرض كل صفحات المنيو (صفحة تلو الأخرى)
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                pdf.getPage(pageNum).then(page => {
                    const viewport = page.getViewport({ scale: 2 }); // جودة عالية
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    
                    container.appendChild(canvas);
                    page.render(renderContext);
                });
            }
        }).catch(err => {
            console.error(err);
            document.getElementById('loading').innerHTML = "حدث خطأ في تحميل الملف. تأكد من وجود ملف menu.pdf في نفس المجلد.";
        });
    </script>
</body>
</html>
